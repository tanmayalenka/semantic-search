<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contract Opportunity Search</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="app-header">
    <div class="container">
        <h1>Contract Opportunity Search</h1>
        <p class="subtitle">Semantic search over contract opportunity titles</p>
    </div>
</header>

<main class="container">
    <section class="search-panel">
        <div class="search-row">
            <input id="query"
                   type="search"
                   placeholder="Try: cloud migration, cybersecurity assessment, janitorial services..."
                   autocomplete="off"
                   autofocus>
            <button id="search-btn" class="btn btn-primary">Search</button>
        </div>

        <div class="search-options">
            <label>
                Results
                <input id="limit" type="number" value="20" min="1" max="100">
            </label>
            <label>
                Min score
                <input id="min-score" type="number" value="0.3" min="0" max="1" step="0.05">
            </label>
            <div class="examples">
                <span>Examples:</span>
                <button class="chip" data-query="cloud migration">cloud migration</button>
                <button class="chip" data-query="cybersecurity">cybersecurity</button>
                <button class="chip" data-query="software development">software development</button>
                <button class="chip" data-query="facilities maintenance">facilities</button>
            </div>
        </div>
    </section>

    <section class="refresh-panel">
        <div class="refresh-info">
            <div class="refresh-title">New records without embeddings?</div>
            <div class="stats-hint">Generates embeddings for records added since the last refresh.</div>
        </div>
        <button id="refresh-btn" class="btn btn-secondary">
            <span id="refresh-label">Refresh embeddings</span>
        </button>
    </section>

    <section id="status" class="status" hidden></section>

    <section id="results" class="results"></section>
</main>

<script src="/app.js"></script>
</body>
</html>
